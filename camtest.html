<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TraceRight – Camera test</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="qrparse.js"></script>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f4f6f8;color:#1b2733}
  header{background:#0f2a44;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{margin:0;font-size:18px}
  header a{color:#9fc3ec;font-size:14px;text-decoration:none}
  main{padding:14px;max-width:560px;margin:auto}
  #reader{width:100%;background:#000;border-radius:12px;overflow:hidden;min-height:60px}
  .btns{display:flex;gap:10px;margin:12px 0}
  button{flex:1;font-size:17px;padding:14px;border-radius:10px;border:none;background:#1f6fd1;color:#fff;font-weight:600}
  button.sec{background:#dfe3e8;color:#1b2733}
  button:disabled{opacity:.5}
  #result{background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:14px;margin-top:6px;display:none}
  #result.ok{border-left:8px solid #2e9d4b}
  #result.bad{border-left:8px solid #d64545}
  .kind{font-size:18px;font-weight:700;margin-bottom:4px}
  .raw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;word-break:break-all;margin-bottom:8px;color:#4a5664}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:5px 4px;border-top:1px solid #eef1f4}
  td:first-child{color:#5b6775;width:45%}
  .err{color:#b42323;font-size:14px;margin-top:6px}
  h2{font-size:15px;margin:18px 0 6px;color:#5b6775}
  #log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#fff;border:1px solid #dfe3e8;border-radius:10px;padding:8px;max-height:200px;overflow:auto}
  #env{font-size:12px;color:#5b6775;margin-top:14px;line-height:1.5}
  #status{font-size:14px;color:#5b6775;min-height:18px}
</style>
</head>
<body>
<header><h1>Step 0 · Camera test</h1><a href="index.html">Home</a></header>
<main>
  <div id="reader"></div>
  <div class="btns">
    <button id="start">Start camera</button>
    <button id="stop" class="sec" disabled>Stop</button>
  </div>
  <div id="status">Tap “Start camera” and allow camera access.</div>

  <div id="result"></div>

  <h2>Scans this session</h2>
  <div id="log">None yet</div>

  <div id="env"></div>
</main>

<script>
(function () {
  var scanner = null, lastCode = '', lastAt = 0, count = 0, audio = null;
  var $ = function (id) { return document.getElementById(id); };

  function beep(ok) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = ok ? 1200 : 300; o.connect(g); g.connect(audio.destination);
      g.gain.value = 0.15; o.start(); o.stop(audio.currentTime + (ok ? 0.12 : 0.35));
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(ok ? 80 : [80, 60, 80]);
  }

  function show(code) {
    var r = TR.parseQR(code), box = $('result');
    var rows = Object.keys(r.fields).map(function (k) {
      return '<tr><td>' + k + '</td><td>' + r.fields[k] + '</td></tr>';
    }).join('');
    box.className = r.ok ? 'ok' : 'bad';
    box.style.display = 'block';
    box.innerHTML = '<div class="kind">' + (r.ok ? '✅ ' : '⚠️ ') + TR.kindLabel(r.kind) + '</div>' +
      '<div class="raw">' + r.raw.replace(/</g, '&lt;') + '</div>' +
      (rows ? '<table>' + rows + '</table>' : '') +
      r.errors.map(function (e) { return '<div class="err">• ' + e + '</div>'; }).join('');
    beep(r.ok);
    count++;
    var t = new Date().toLocaleTimeString();
    var line = count + '. ' + t + '  ' + TR.kindLabel(r.kind) + '  ' + r.raw.replace(/</g, '&lt;');
    $('log').innerHTML = (count === 1 ? '' : $('log').innerHTML) + '<div>' + line + '</div>';
  }

  function onScan(text) {
    var now = Date.now();
    if (text === lastCode && now - lastAt < 2500) return;   // ignore the same code held in view
    lastCode = text; lastAt = now;
    show(text);
  }

  $('start').onclick = function () {
    $('status').textContent = 'Starting camera…';
    // unlock audio on iOS with a user gesture
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
    scanner = scanner || new Html5Qrcode('reader', {
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    scanner.start({ facingMode: 'environment' },
      { fps: 12, qrbox: function (w, h) { var s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
      onScan, function () {})
      .then(function () {
        $('start').disabled = true; $('stop').disabled = false;
        $('status').textContent = 'Point the camera at a QR code.';
      })
      .catch(function (err) {
        $('status').textContent = 'Camera could not start: ' + err;
      });
  };

  $('stop').onclick = function () {
    if (!scanner) return;
    scanner.stop().then(function () {
      $('start').disabled = false; $('stop').disabled = true;
      $('status').textContent = 'Camera stopped.';
    });
  };

  $('env').innerHTML =
    'Browser: ' + navigator.userAgent.replace(/</g, '&lt;') + '<br>' +
    'Secure page (HTTPS): ' + (window.isSecureContext ? 'yes' : 'NO – camera will be blocked') + '<br>' +
    'Native BarcodeDetector: ' + ('BarcodeDetector' in window ? 'available' : 'not available (library decoder used)');
})();
</script>
</body>
</html>
